name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # pnpm-workspace.yaml의 allowBuilds는 pnpm 11 문법이라, 9로는
          # "packages field missing or empty"로 설치가 죽는다.
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11은 node:sqlite를 쓰므로 Node 22.13 이상이 필요하다.
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'eco-terrarium/pnpm-lock.yaml'

      - name: Install dependencies
        run: cd eco-terrarium && pnpm install --frozen-lockfile

      - name: Build
        run: cd eco-terrarium && pnpm build

      # rule-machine은 pnpm 워크스페이스가 아니라 독립 npm 프로젝트라 따로 설치·빌드한다.
      - name: Install rule-machine dependencies
        run: cd rule-machine && npm ci

      - name: Test and build rule-machine
        run: cd rule-machine && npm run verify

      # eco-terrarium은 루트에, rule-machine은 /rule-machine/ 하위 경로에 올린다.
      # vite base가 './'라서 하위 경로에서도 에셋 경로가 깨지지 않는다.
      - name: Merge rule-machine into Pages output
        run: |
          mkdir -p eco-terrarium/dist/rule-machine
          cp -R rule-machine/dist/. eco-terrarium/dist/rule-machine/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'eco-terrarium/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
